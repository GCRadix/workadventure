# Settings for exported map-editor objects (read by build_objects.lua).
#   <category>/<object>   or   <category>/*   (object = .aseprite file name without extension)
#   collision=none|base|all|<rows>   which 32 px tile rows block players: base = the bottom row. Default none.
#   depth=<px>                        draw-order shift (depthOffset). Default: -32 per collision row, so players
#                                     standing behind the object are drawn behind it. Use depth=32 for things
#                                     placed on a table so they draw over the table.
# An object setting wins over its category's * line.

# depth=0 (not the default -32): wall decor hanging down behind a desk must not draw over the desk. Players
# behind a table are still drawn behind it, the collision row keeps their feet above the table's bottom edge.
tables/*                      collision=base depth=0
computer/*                    depth=32

# things standing on the floor
decoration/camera_tripod      collision=none
decoration/flamingo           collision=none
decoration/gramophone         collision=none
decoration/guitar             collision=none
decoration/radiator           collision=none

# things hanging on a wall: no depth needed. The map's wall_above layer has the ySort property, so it sorts
# by y like objects do. Only computer/blueprint_screen needs a line to drop the desk depth of computer/*.
computer/blueprint_screen     depth=0

# things standing on a table
decoration/coffee_cup         depth=32
decoration/monster            depth=32
decoration/switch             depth=32
